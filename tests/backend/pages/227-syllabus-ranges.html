<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>227 Backend: Read ranges, weeks and meeting types from a syllabus</title>
<link rel="stylesheet" href="../../shared/runner.css">
<script type="module">
// Backend test: real API, no screen code. Imports nothing from src/.
// What this page covers: the saving half of card 227 (import-confirm and events). The reader itself needs a
// live Gemini read, which a page must never make, so its prompt, schema and clean-up are checked with canned
// model replies in tests/backend/php/syllabus-ai.php (check 12) and tests/backend/php/import-extract.php (PASS 5).
import { page, test, expect, api, signIn, signOut } from "../../shared/runner.js";

page({ card: "227", title: "Backend: Read ranges, weeks and meeting types from a syllabus", kind: "backend" });
const A = "notely-task227-442@example.edu";
const B = "notely-task227b-442@example.edu";
const CONFIRM = "backend/lib/imports.php → importAction (the import-confirm branch)";
const REVIEWED = "backend/lib/imports.php → reviewedEvents";
const course = "t227-c1";
const XSS = "<script>alert(1)<\/script>'; DROP TABLE notely_events; --";
const deadlines = [
  { title: "Homework 2", kind: "assignment", date: "2026-09-14", time: "23:59", location: "" },
  { title: "Project proposal", kind: "deadline", date: "2026-10-02", time: "", location: "" },
];
const upload = async (name = "syllabus.txt") => (await api("syllabus-upload", { courseId: course, fileName: name, content: btoa("Homework 2 due September 14") })).body.job;
const saved = async () => (await api("events", undefined, { courseId: course })).body.events;

async function clean() {
  for (const who of [A, B]) {
    await signIn(who);
    await api("workspace-clear", { confirm: "CLEAR" });
  }
}
await clean();
await signOut();

await test("1. A signed-out visitor can confirm events or read them", CONFIRM, async () => {
  expect(await api("import-confirm", { id: "1", events: deadlines })).toEqual(401, { error: "Sign in to continue." });
  expect(await api("events")).toEqual(401, { error: "Sign in to continue." });
});
await signIn(A);
await test("2. The wrong method is accepted on import-confirm", "backend/index.php (the method check)", async () => {
  expect(await api.raw("GET", "import-confirm")).toEqual(405, { error: "This request method is not supported." });
});
let job;
await test("3. Assignment deadlines with exact dates are not saved as assignment and deadline events", CONFIRM, async () => {
  job = await upload();
  expect(await api("import-confirm", { id: job.id, courseId: course, events: deadlines })).toEqual(200, { created: 2, skipped: 0 });
  const events = await saved();
  expect(events.map((e) => [e.title, e.kind, e.date, e.time, e.source, e.importJobId])).toEqual([
    ["Homework 2", "assignment", "2026-09-14", "23:59", "imported", job.id],
    ["Project proposal", "deadline", "2026-10-02", "", "imported", job.id],
  ]);
});
await test("4. Confirming the same job twice saves the deadlines twice", CONFIRM, async () => {
  expect(await api("import-confirm", { id: job.id, courseId: course, events: deadlines })).toEqual(200, { created: 0, skipped: 0 });
  expect((await saved()).length).toBe(2);
});
await test("5. An item with a date that also carries a range, week and meeting type is refused or saved on the wrong day", CONFIRM, async () => {
  const j = await upload("second.txt");
  const item = { title: "Lab 3", kind: "assignment", date: "2026-10-09", time: "17:00", rangeStart: "2026-10-05", rangeEnd: "2026-10-09", week: 5, meeting: "lab" };
  expect(await api("import-confirm", { id: j.id, courseId: course, events: [item] })).toEqual(200, { created: 1, skipped: 0 });
  const lab = (await saved()).find((e) => e.title === "Lab 3");
  expect([lab.date, lab.time, lab.kind]).toEqual(["2026-10-09", "17:00", "assignment"]);
  expect(Object.keys(lab).filter((k) => ["rangeStart", "rangeEnd", "week", "meeting"].includes(k))).toEqual([]);
});
await test("6. A range or week item with no day is saved without a date instead of refused", REVIEWED, async () => {
  const j = await upload("third.txt");
  for (const extra of [{ rangeStart: "2026-10-05", rangeEnd: "2026-10-09", meeting: "lab" }, { week: 5, meeting: "lecture" }])
    expect(await api("import-confirm", { id: j.id, courseId: course, events: [{ title: "Quiz 2", kind: "quiz", date: "", ...extra }] }))
      .toEqual(422, { error: "Give every event a title and a date." });
  expect((await saved()).some((e) => e.title === "Quiz 2")).toBe(false);
});
await test("7. A wrong event type or date is accepted next to the new fields", REVIEWED, async () => {
  const j = await upload("fourth.txt");
  expect(await api("import-confirm", { id: j.id, courseId: course, events: [{ title: "x", kind: "party", date: "2026-10-05", meeting: "lab" }] }))
    .toEqual(422, { error: "Choose a valid event type." });
  expect(await api("import-confirm", { id: j.id, courseId: course, events: [{ title: "x", kind: "quiz", date: "2026-02-30", week: 5 }] }))
    .toEqual(422, { error: "Choose a real date for every event." });
});
await test("8. Another student can confirm into a job that is not theirs", CONFIRM, async () => {
  await signIn(B);
  expect(await api("import-confirm", { id: job.id, courseId: course, events: deadlines })).toEqual(404, { error: "This upload could not be found." });
  expect((await saved()).length).toBe(0);
  await signIn(A);
});
await test("9. Script and SQL text in a title is changed or run instead of stored as text", CONFIRM, async () => {
  const j = await upload("fifth.txt");
  expect((await api("import-confirm", { id: j.id, courseId: course, events: [{ title: XSS, kind: "assignment", date: "2026-11-02" }] })).status).toBe(200);
  expect((await saved()).some((e) => e.title === XSS)).toBe(true);
});

await clean();
await signOut();
</script>
